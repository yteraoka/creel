name: tagpr

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tagpr:
    name: tagpr
    runs-on: ubuntu-latest
    steps:
      # tagpr needs a token other than GITHUB_TOKEN: a tag pushed with the
      # workflow's own token would not trigger the release workflow.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.TAGPR_APP_ID }}
          private-key: ${{ secrets.TAGPR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: Songmu/tagpr@7ebae2dcc300132baa7cc9dd108c8923b07fc366 # v1.20.3
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
